global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0  # 保留：全局地图无需高频更新
      publish_frequency: 1.0  # 保留：平衡实时性与资源消耗
      global_frame: map  # 保留：标准全局坐标系
      robot_base_frame: base_link  # 保留：与URDF基准坐标系一致
      use_sim_time: True  # 保留：仿真场景必备
      #footprint_is_radius: true  # 保留：简化车辆轮廓处理
      robot_radius: 1.53  # 关键调整：原0.22过小（仅对应车轮半径），正确值=车身半宽（URDF车身宽度1.8m），避免碰撞
      #footprint: "[[-0.929, -0.971], [-0.929, 0.971], [3.76, 0.971], [3.76, -0.971]]"  # 车辆轮廓多边形坐标
      #resolution: 0.05  # 保留：高精度地图，但配合降采样因子2，实际处理分辨率0.1m，兼顾细节与效率
      resolution: 0.5 # 关键调整：原0.05过高，导致计算量过大；0.25配合降采样后实际处理分辨率0.5m，适合泊车场景，提升效率
      track_unknown_space: true  # 保留：适配泊车场景未知区域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 保留：标准图层组合
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True  # 保留：确保静态地图正确订阅
        
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5  # 调整：原2.0过高，过滤地面以上无关障碍（如天花板），聚焦车身高度（约0.1m）
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0  # 保留：匹配激光扫描范围
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5  # 保留：确保障碍检测精度
          obstacle_min_range: 0.0
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0  # 保留：平衡障碍规避与路径紧凑性
        inflation_radius: 1.53  # 关键调整：原0.55过小，正确值=车身半宽（0.9m）+0.05m安全余量，确保车身不碰障碍
      
      always_send_full_costmap: True  # 保留：确保全局地图完整传输

  global_costmap_client:
    ros__parameters:
      use_sim_time: True
      
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True